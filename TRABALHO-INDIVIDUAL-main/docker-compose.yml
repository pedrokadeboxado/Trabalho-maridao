version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projeto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projeto"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maridao_network

  backend:
    build:
      context: ./back_projeto
      dockerfile: Dockerfile
    container_name: maridao_backend
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/projeto"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - maridao_network

  frontend:
    build:
      context: ./front_projeto
      dockerfile: Dockerfile
    container_name: frontend_maridao_frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - maridao_network

networks:
  maridao_network:
    driver: bridge

volumes:
  postgres_data: